<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亞萬回饋</title>
    <!-- 引入思源黑體與思源宋體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 現代法式華麗調色盤 */
            --bg-color: #fcfbf9;          /* 珍珠白背景 (極淨明亮) */
            --text-main: #1d1d1b;         /* 曜石黑 (高級感深色) */
            --text-muted: #95908a;        /* 暖灰次要文字 */
            --accent-color: #b58d3d;      /* 奢華復古金 */
            --highlight-bg: #ffffff;      /* 重點列純白底 */
            --highlight-text: #17385c;    /* 沉穩皇室藍 */
            --border-color: #e8e3dc;      /* 暖調淺邊框 */
            --card-bg: #ffffff;           
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 960px;
            margin: 0 auto;
            padding: 50px 20px;
            line-height: 1.8;
        }

        h2 {
            font-family: 'Noto Serif TC', serif;
            text-align: center;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--text-main);
            margin-bottom: 60px;
            font-size: 2.2rem;
            text-transform: uppercase;
        }

        /* 輸入區塊 */
        .input-section {
            text-align: center;
            margin-bottom: 50px;
        }
        .input-label {
            font-family: 'Noto Serif TC', serif;
            display: block;
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: var(--text-main);
            font-weight: 600;
        }
        input[type="number"] {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1.8rem;
            padding: 12px;
            width: 240px;
            text-align: center;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            outline: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input[type="number"]:focus {
            border-bottom: 2px solid var(--accent-color);
            transform: translateY(-2px);
        }

        /* 工具列與按鈕 */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }
        .btn-toggle {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 28px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            transition: all 0.4s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .btn-toggle:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background-color: #fff;
            box-shadow: 0 6px 15px rgba(181, 141, 61, 0.15);
            transform: translateY(-1px);
        }

        /* 銀行區塊標題 */
        .bank-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 60px 0 25px 0;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            letter-spacing: 1.5px;
        }
        .bank-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 22px;
            background-color: var(--accent-color);
            margin-right: 15px;
        }
        .bank-title a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .bank-title a:hover {
            color: var(--accent-color);
        }
        .bank-time {
            font-family: 'Noto Sans TC', sans-serif;
            margin-left: auto;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* 卡片式排版 - 華麗凸出版 */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 20px; 
        }
        .card-item {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 22px 24px;
            display: grid;
            grid-template-columns: 2fr 2.5fr 1.5fr 1.5fr 1fr 1fr; /* 微調欄寬給條件標籤 */
            align-items: center;
            gap: 15px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0,0,0,0.03); 
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .card-item:hover {
            box-shadow: 0 15px 40px rgba(29, 29, 27, 0.08), 0 4px 12px rgba(181, 141, 61, 0.08);
            transform: translateY(-4px);
        }
        
        .card-item.main-row {
            background-color: var(--highlight-bg);
            border: 1px solid rgba(181, 141, 61, 0.2);
            border-left: 5px solid var(--accent-color);
        }

        .card-item.secondary-row {
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--border-color);
        }

        .card-col {
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.5;
        }
        .mobile-label {
            display: none; 
        }

        /* ====== 新增：條件精品標籤 (Badge) ====== */
        .condition-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        /* 重點推薦（主卡片）的條件標籤：奢華實心金底 */
        .main-row .condition-badge {
            background: linear-gradient(135deg, #c49d47, var(--accent-color));
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(181, 141, 61, 0.25);
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            border: 1px solid transparent;
        }

        /* 展開細項（次卡片）的條件標籤：優雅鏤空金線 */
        .secondary-row .condition-badge {
            background-color: rgba(181, 141, 61, 0.03);
            color: var(--accent-color);
            border: 1px solid rgba(181, 141, 61, 0.4);
        }

        .val-highlight {
            font-family: 'Noto Serif TC', serif;
            color: var(--highlight-text);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
        }
        .val-note {
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .card-sub-name {
            display: block;
            font-size: 0.85em;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 400;
        }

        /* 備註說明區 */
        .notes-section {
            margin-top: 70px;
            padding-top: 35px;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.8;
        }
        .notes-section p strong {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.1rem;
            color: var(--text-main);
            letter-spacing: 1px;
        }
        .notes-section ul {
            padding-left: 20px;
            margin-top: 12px;
        }
        .notes-section a {
            color: var(--accent-color);
            text-decoration: none;
            border-bottom: 1px solid var(--accent-color);
            transition: opacity 0.3s;
        }
        .notes-section a:hover {
            opacity: 0.7;
        }

        /* 電腦版表頭 */
        .desktop-header {
            display: grid;
            grid-template-columns: 2fr 2.5fr 1.5fr 1.5fr 1fr 1fr;
            gap: 15px;
            padding: 0 24px 15px 24px;
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* 手機版響應式設計 */
        @media (max-width: 768px) {
            .desktop-header { display: none; }
            .card-item {
                display: flex;
                flex-direction: column;
                padding: 25px 20px;
                gap: 15px;
            }
            .card-col {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid var(--border-color);
                padding-bottom: 12px;
                text-align: right;
            }
            .card-col:last-child {
                border-bottom: none;
                padding-bottom: 0;
            }
            .mobile-label {
                display: block; 
                font-size: 0.85rem;
                color: var(--text-muted);
                letter-spacing: 1px;
                text-align: left;
            }
            input[type="number"] {
                width: 100%;
                max-width: 300px;
            }
            .bank-time {
                font-size: 0.75rem; 
            }
            .card-sub-name {
                display: inline;
                margin-top: 0;
                margin-left: 4px;
            }
        }
    </style>
</head>
<body>

    <h2>日常飛行試算</h2>
    
    <div class="input-section">
        <label class="input-label" for="amount">預計消費金額 (NTD)</label>
        <input type="number" id="amount" placeholder="0" min="0" oninput="calculateMiles()">
    </div>

    <div class="toolbar">
        <button id="toggleBtn" class="btn-toggle" onclick="toggleRows()">展開完整明細</button>
    </div>

    <div id="resultContainer"></div>

    <div class="notes-section">
        <p>📝 <strong>試算筆記：</strong></p>
        <ul>
            <li>預設僅顯示「重點推薦組合」，點擊右上角按鈕可查看各項加碼拆解明細。</li>
            <li>「獲得點數」支援 **分段計算邏輯** ：如標示為「相加」的回饋，系統會自動將各%數分開計算進位/捨去後再行加總，與銀行實際計算方式相符。</li>
            <li>兌換門檻依各銀行官方規定為主（如：台新需滿10點、國泰需滿360點）。本系統顯示之「等值哩數」為依比例換算之理論值，便於跨行比較。</li>
            <li>平均「元/哩」若顯示為「-」，代表消費金額過低，尚未達到獲得點數的最低門檻。</li>
            <li><a href="https://cardswitch.pages.dev/search" target="_blank">權益切換通網站</a></li>
        </ul>
    </div>

    <script>
        let showAllRows = false;

        const bankDetails = {
            '台新': {
                url: 'https://mkp.taishinbank.com.tw/TsCms/marketing/expose/WM_20251216135929999/index.html?utm_source=google&utm_medium=pmax&utm_campaign=cc_20251216135929999&utm_content=digital&gad_source=1&gad_campaignid=22091010688&gbraid=0AAAAABhSXuQeUDS8W93tc-9Urof6W-_5W&gclid=CjwKCAjwqJXUBhBNEiwA8BgG7tCEF4XUi3BrfpAr1sOsrZYEpt3RDLUfJQBxYxnwxEU9to_69eMJ-hoCjkUQAvD_BwE',
                time: '~2027/03/31'
            },
            '玉山': {
                url: 'https://event.esunbank.com.tw/credit/unicard-b/discount-channel.html',
                time: '~2026/12/31'
            },
            '國泰': {
                url: 'https://www.cathay-cube.com.tw/cathaybk/personal/product/credit-card/cards/cube-list',
                time: '~2026/12/31'
            },
            '匯豐': {
                url: 'https://www.beurlife.com/2024/07/hsbc-live-plus-credit-card.html#google_vignette',
                time: '~2026/09/30'
            }
        };

        const cardData = [
            // 台新
            { bank: '台新', card: '太陽玫瑰<br><span class="card-sub-name">(無條件捨去)</span>', condition: '領券加碼 1.5%', rate: 0.015, roundType: 'floor', milesPerPoint: 1.8, limit: '500/月 至9/30', isMain: false },
            { bank: '台新', card: '太陽玫瑰<br><span class="card-sub-name">(無條件捨去)</span>', condition: 'LinePay 2.3%', rate: 0.023, roundType: 'floor', milesPerPoint: 1.8, limit: '無', isMain: false },
            { bank: '台新', card: '太陽玫瑰<br><span class="card-sub-name">(分開無條件捨去)</span>', condition: 'LinePay合計 3.8%', rate: 0.038, splitRates: [0.015, 0.023], roundType: 'floor', milesPerPoint: 1.8, limit: '含加碼 至9/30', isMain: true },
            { bank: '台新', card: '太陽玫瑰<br><span class="card-sub-name">(無條件捨去)</span>', condition: '其餘權益 3.3%', rate: 0.033, roundType: 'floor', milesPerPoint: 1.8, limit: '無', isMain: true },
            { bank: '台新', card: '太陽玫瑰<br><span class="card-sub-name">(無條件捨去)</span>', condition: 'Pay著刷 3.8%', rate: 0.038, roundType: 'floor', milesPerPoint: 1.8, limit: '無', isMain: true },

            // 玉山
            { bank: '玉山', card: 'Unicard<br><span class="card-sub-name">(四捨五入)</span>', condition: '自扣+電子 1.0%', rate: 0.01, roundType: 'round', milesPerPoint: 1.5, limit: '無', isMain: false },
            { bank: '玉山', card: 'Unicard<br><span class="card-sub-name">(四捨五入)</span>', condition: '任意選8家 2.5%', rate: 0.025, roundType: 'round', milesPerPoint: 1.5, limit: '1,000/月', isMain: false },
            { bank: '玉山', card: 'Unicard<br><span class="card-sub-name">(四捨五入)</span>', condition: '任意選合計 3.5%', rate: 0.035, splitRates: [0.01, 0.025], roundType: 'round', milesPerPoint: 1.5, limit: '含加碼', isMain: true },

            // 國泰
            { bank: '國泰', card: 'Cube<br><span class="card-sub-name">(四捨五入)</span>', condition: '集精選 2.0%', rate: 0.02, roundType: 'round', milesPerPoint: 1000/360, limit: '無', isMain: true },
            { bank: '國泰', card: 'Cube<br><span class="card-sub-name">(四捨五入)</span>', condition: '其餘權益 3.0%', rate: 0.03, roundType: 'round', milesPerPoint: 1000/360, limit: '無', isMain: true },
            { bank: '國泰', card: 'Cube<br><span class="card-sub-name">(四捨五入)</span>', condition: '特定加碼 4.0%', rate: 0.04, roundType: 'round', milesPerPoint: 1000/360, limit: '領券加碼', isMain: false },
            { bank: '國泰', card: 'Cube<br><span class="card-sub-name">(四捨五入)</span>', condition: '屈臣氏 5.0%', rate: 0.05, roundType: 'round', milesPerPoint: 1000/360, limit: '領券加碼', isMain: false },

            // 匯豐
            { bank: '匯豐', card: 'Live+<br><span class="card-sub-name">(四捨五入)</span>', condition: '一般消費 0.88%', rate: 0.0088, roundType: 'round', milesPerPoint: 2, limit: '無', isMain: false },
            { bank: '匯豐', card: 'Live+<br><span class="card-sub-name">(四捨五入)</span>', condition: '帳戶自扣 1.0%', rate: 0.01, roundType: 'round', milesPerPoint: 2, limit: '200/月', isMain: false },
            { bank: '匯豐', card: 'Live+<br><span class="card-sub-name">(四捨五入)</span>', condition: '一般消費合計 1.88%', rate: 0.0188, splitRates: [0.0088, 0.01], roundType: 'round', milesPerPoint: 2, limit: '含自扣', isMain: true },
            { bank: '匯豐', card: 'Live+<br><span class="card-sub-name">(四捨五入)</span>', condition: '餐飲/購物/娛樂 3.0%', rate: 0.03, roundType: 'round', milesPerPoint: 2, limit: '888/月', isMain: false },
            { bank: '匯豐', card: 'Live+<br><span class="card-sub-name">(四捨五入)</span>', condition: '三大通路合計 4.88%', rate: 0.0488, splitRates: [0.0088, 0.01, 0.03], roundType: 'round', milesPerPoint: 2, limit: '含各項上限', isMain: true },
        ];

        function toggleRows() {
            showAllRows = !showAllRows;
            const btn = document.getElementById('toggleBtn');
            btn.innerText = showAllRows ? '收合明細' : '展開完整明細';
            calculateMiles(); 
        }

        function calculateMiles() {
            const amountInput = document.getElementById('amount').value;
            const amount = parseFloat(amountInput) || 0;
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';

            if (amount === 0) {
                container.innerHTML = '<div style="text-align:center; padding:70px 20px; font-family:\'Noto Serif TC\', serif; color:var(--text-muted); letter-spacing: 1px; font-size: 1.1rem;">請於上方輸入金額開始試算</div>';
                return;
            }

            let currentBank = '';
            let currentList = null;

            cardData.forEach(card => {
                if (!showAllRows && !card.isMain) return;

                if (card.bank !== currentBank) {
                    currentBank = card.bank;
                    
                    const info = bankDetails[currentBank] || { url: '#', time: '' };

                    const bankTitle = document.createElement('div');
                    bankTitle.className = 'bank-title';
                    bankTitle.innerHTML = `
                        <a href="${info.url}" target="_blank" title="前往活動官網">${currentBank}銀行 🔗</a>
                        <span class="bank-time">活動時間：${info.time}</span>
                    `;
                    container.appendChild(bankTitle);

                    const desktopHeader = document.createElement('div');
                    desktopHeader.className = 'desktop-header';
                    desktopHeader.innerHTML = `
                        <div>卡別與規則</div>
                        <div>消費條件</div>
                        <div>獲得點數</div>
                        <div>等值哩數</div>
                        <div>平均(元/哩)</div>
                        <div>備註</div>
                    `;
                    container.appendChild(desktopHeader);

                    currentList = document.createElement('div');
                    currentList.className = 'card-list';
                    container.appendChild(currentList);
                }

                // 計算邏輯
                let points = 0;
                if (card.splitRates) {
                    card.splitRates.forEach(rate => {
                        if (card.roundType === 'floor') {
                            points += Math.floor(amount * rate);
                        } else if (card.roundType === 'round') {
                            points += Math.round(amount * rate);
                        }
                    });
                } else {
                    if (card.roundType === 'floor') {
                        points = Math.floor(amount * card.rate);
                    } else if (card.roundType === 'round') {
                        points = Math.round(amount * card.rate);
                    }
                }

                const miles = points * card.milesPerPoint;
                let costPerMile = '-';
                if (miles > 0) costPerMile = (amount / miles).toFixed(2);

                const cardEl = document.createElement('div');
                cardEl.className = `card-item ${card.isMain ? 'main-row' : 'secondary-row'}`;
                
                cardEl.innerHTML = `
                    <div class="card-col">
                        <span class="mobile-label">卡別</span>
                        <span>${card.card}</span>
                    </div>
                    <div class="card-col">
                        <span class="mobile-label">條件</span>
                        <!-- 將條件欄位改為精品標籤 Badge 樣式 -->
                        <span class="condition-badge">${card.condition}</span>
                    </div>
                    <div class="card-col">
                        <span class="mobile-label">獲得點數</span>
                        <span class="val-highlight">${points.toLocaleString()} 點</span>
                    </div>
                    <div class="card-col">
                        <span class="mobile-label">等值哩數</span>
                        <span class="val-highlight">${Math.floor(miles).toLocaleString()} 哩</span>
                    </div>
                    <div class="card-col">
                        <span class="mobile-label">元/哩</span>
                        <span>${costPerMile}</span>
                    </div>
                    <div class="card-col">
                        <span class="mobile-label">備註</span>
                        <span class="val-note">${card.limit}</span>
                    </div>
                `;
                currentList.appendChild(cardEl);
            });
        }

        calculateMiles();
    </script>
</body>
</html>
